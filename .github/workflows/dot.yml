name: Dot's Nightly Audit

on:
  schedule:
    - cron: '0 2 * * *' # Runs at 02:00 UTC
  workflow_dispatch:

jobs:
  dot_run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run dot.py
        env:
          GEM_KEY_DOT: ${{ secrets.GEM_KEY_DOT }}
          EMAIL: ${{ secrets.EMAIL }}
          APP_PSWD: ${{ secrets.APP_PSWD }}
        run: python dot.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "Dot-Bot"
          git config --global user.email "dot-bot@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Dot: Nightly audit, emails, and motion update" && git push)