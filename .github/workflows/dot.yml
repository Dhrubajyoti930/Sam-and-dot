name: Dot — Daily Watchdog

on:
  schedule:
    - cron: "0 23 * * *"   # 23:00 UTC — runs after Sam's evening cycle
  workflow_dispatch:         # Manual trigger for owner

permissions:
  contents: write

jobs:
  dot-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10      # Dot's budget is tighter; protect the shared pool

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai

      - name: Run Dot's daily watchdog review
        env:
          GEM_KEY_DOT: ${{ secrets.GEM_KEY_DOT }}
          EMAIL:       ${{ secrets.EMAIL }}
          APP_PSWD:    ${{ secrets.APP_PSWD }}
        run: python bag/dot.py

      - name: Commit Dot's outputs
        run: |
          git config user.name  "Dot [bot]"
          git config user.email "dot-bot@users.noreply.github.com"
          git add bag/motion.md bag/dot.log bag/experiences.json bag/sent_emails.json bag/request.json bag/
          git diff --cached --quiet || git commit -m "chore(dot): daily watchdog report [skip ci]"
          git push
