name: Dot — Daily Watchdog

on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST — morning brief
    - cron: "30 5 * * *"   # 11:00 IST — midday check
    - cron: "30 13 * * *"  # 19:00 IST — evening close
      
  workflow_dispatch:         # Manual trigger for owner

permissions:
  contents: write

jobs:
  dot-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10      # Dot's budget is tighter; protect the shared pool

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Dot's daily watchdog review
        env:
          GEM_KEY_DOT: ${{ secrets.GEM_KEY_DOT }}
          EMAIL:       ${{ secrets.EMAIL }}
          APP_PSWD:    ${{ secrets.APP_PSWD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          PYTHONPATH:  ${{ github.workspace }}/World/Dot
        run: python World/Dot/dot.py

      - name: Commit Dot's outputs
        run: |
          git config user.name  "Dot [bot]"
          git config user.email "dot-bot@users.noreply.github.com"
          git stash --include-untracked
          git pull --rebase origin main
          git stash pop
          git add World/
          git diff --cached --quiet || git commit -m "chore(dot): daily watchdog report [skip ci]"
          git push
