name: Sam Run

on:
  schedule:
    - cron: '0 0-19 * * *' # Runs every hour on the hour from 00:00 to 19:00 (20 total runs)
  workflow_dispatch:     # Allows manual execution via the GitHub UI

jobs:
  run-sam:
    runs-on: ubuntu-latest
    
    # CRITICAL FIX: Grants the workflow permission to write changes back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Execute Sam
        env:
          GEM_KEY_SAM: ${{ secrets.GEM_KEY_SAM }}
        run: python sam.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "Sam-Bot"
          git config --global user.email "sam-bot@users.noreply.github.com"
          git add dot.py
          git diff --quiet && git diff --staged --quiet || (git commit -m "Sam: Evolved dot.py tool suite" && git push)
