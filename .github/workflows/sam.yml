name: Sam's Daily Runs

on:
  schedule:
    - cron: '0 8,20 * * *' # Runs at 08:00 and 20:00 UTC
  workflow_dispatch:

jobs:
  sam_run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sam.py
        env:
          GEM_KEY_SAM: ${{ secrets.GEM_KEY_SAM }}
        run: python sam.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "Sam-Bot"
          git config --global user.email "sam-bot@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Sam: Daily expansion and logs" && git push)