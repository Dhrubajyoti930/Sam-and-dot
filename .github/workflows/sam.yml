name: Sam — Operational Cycles

on:
  schedule:
    - cron: "30 7 * * *"   # 13:00 IST — cycle 2
    - cron: "30 10 * * *"  # 16:00 IST — cycle 3
    - cron: "30 16 * * *"  # 22:00 IST — cycle 4
  workflow_dispatch:         # Manual trigger for owner

permissions:
  contents: write            # Sam commits changes back to the repo

jobs:
  sam-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12      # Hard ceiling — protect the shared pool

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0     # Full history for rollback registry awareness

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Auto-install Sam's bag/ dependencies
        run: |
          python - << 'EOF'
          import ast, sys, subprocess
          from pathlib import Path

          installed = set()
          try:
              from importlib.metadata import packages_distributions
              dist = packages_distributions()
              for k in dist:
                  installed.add(k.lower())
          except Exception:
              pass

          stdlib = sys.stdlib_module_names
          missing = set()

          # Scan Sam and Dot directories
          for folder in [Path('World/Sam'), Path('World/Dot')]:
              for f in folder.rglob('*.py'):
                  if 'rollback_registry' in f.parts or '__pycache__' in f.parts:
                      continue
                  try:
                      tree = ast.parse(f.read_text(errors='replace'))
                      for node in ast.walk(tree):
                          if isinstance(node, ast.Import):
                              for alias in node.names:
                                  name = alias.name.split('.')[0]
                                  if name and name not in stdlib and name.lower() not in installed:
                                      missing.add(name)
                          elif isinstance(node, ast.ImportFrom):
                              name = (node.module or '').split('.')[0]
                              if name and name not in stdlib and name.lower() not in installed:
                                  missing.add(name)
                  except Exception:
                      pass
          
          # Filter out local packages
          local_dirs = {p.name for p in Path('World').rglob('*') if p.is_dir()}
          local_packages = {'bag', 'Gemini_note_pad', 'hardware', 'tests', 'Others'} | local_dirs
          missing = {m for m in missing if m not in local_packages}

          # Map common import names to their pip package names
          pip_map = {
              'sklearn': 'scikit-learn',
              'cv2': 'opencv-python',
              'PIL': 'Pillow',
              'bs4': 'beautifulsoup4',
              'yaml': 'PyYAML',
              'dotenv': 'python-dotenv',
          }

          if missing:
              pip_names = [pip_map.get(m, m) for m in missing]
              print(f'Installing missing packages: {pip_names}')
              subprocess.run([sys.executable, '-m', 'pip', 'install', *pip_names], check=True)

              # Add to requirements.txt so they are cached next cycle
              req_path = Path('requirements.txt')
              existing = req_path.read_text().splitlines() if req_path.exists() else []
              existing_lower = {r.split('==')[0].split('>=')[0].strip().lower() for r in existing}
              new_reqs = [p for p in pip_names if p.lower() not in existing_lower]
              if new_reqs:
                  with open(req_path, 'a') as rf:
                      for r in new_reqs:
                          rf.write(f'\n{r}')
                  print(f'Added to requirements.txt: {new_reqs}')
          else:
              print('All bag/ imports satisfied.')
          EOF

      - name: Auto-fix lint issues
        run: |
          ruff check . --select F --exclude bag/rollback_registry --fix --unsafe-fixes || true

      - name: Lint Python files
        run: |
          ruff check World/Sam/sam.py --select F
          ruff check World/Sam/bag/ --select F || true
          ruff check World/Dot/dot.py --select F

      - name: Run Sam's operational cycle
        env:
          GEM_KEY_SAM: ${{ secrets.GEM_KEY_SAM }}
          PYTHONPATH: ${{ github.workspace }}/World/Sam
        run: python World/Sam/sam.py

      - name: Commit Sam's outputs
        run: |
          STATUS_FILE=$(python -c "import sys; from pathlib import Path; sys.path.append('World/Sam'); from bag.bag_paths import resolve; print(resolve(Path('World/Sam/bag'), 'cycle_status'))" 2>/dev/null || echo "World/Sam/My_memories/cycle_status.txt")
          if [ ! -f "$STATUS_FILE" ] || [ "$(cat $STATUS_FILE)" != "ok" ]; then
            echo "Cycle did not complete cleanly — skipping commit."
            exit 0
          fi
          git config user.name  "Sam [bot]"
          git config user.email "sam-bot@users.noreply.github.com"
          git stash --include-untracked
          git pull --rebase origin main
          git stash pop
          git add -A
          git diff --cached --quiet || git commit -m "chore(sam): cycle outputs [skip ci]"
          git push
