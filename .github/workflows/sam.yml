name: Sam — Operational Cycles

on:
  # Sam runs at least 1 times a day; additional runs can be triggered by push or dispatch.
  schedule:
  - cron: "0 10 * * 3"   # Wednesday 10:00 UTC
  - cron: "0 10 * * 6"   # Saturday 10:00 UTC   # 02:00 UTC
    
  workflow_dispatch:       # Manual trigger for high-value or immediate tasks

permissions:
  contents: write          # Sam commits changes back to the repo

jobs:
  sam-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10    # Hard ceiling — protect the shared 1300 s/month pool

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history for rollback registry awareness

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-generativeai

      - name: Run Sam's operational cycle
        env:
          GEM_KEY_SAM: ${{ secrets.GEM_KEY_SAM }}
        run: python sam.py

      - name: Commit Sam's outputs
        run: |
          git config user.name  "Sam [bot]"
          git config user.email "sam-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(sam): cycle outputs [skip ci]"
          git push
